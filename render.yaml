# Render Blueprint for Dandora AirWatch.
# Baseline cost: $7/month API + $6/month Postgres + 1 GB database storage.
services:
  - type: web
    name: dandora-airwatch-api
    runtime: go
    rootDir: backend
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: go build -tags netgo -ldflags '-s -w' -o bin/server ./cmd/server && go build -tags netgo -ldflags '-s -w' -o bin/ingest ./cmd/ingest
    startCommand: ./bin/server
    healthCheckPath: /health
    initialDeployHook: ./bin/ingest
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dandora-airwatch-db
          property: connectionString
      - key: DATABASE_CONNECT_TIMEOUT
        value: 5m
      - key: SATELLITE_MODE
        value: fixture
      - key: INGEST_DAYS
        value: "90"

  - type: web
    name: dandora-airwatch
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://dandora-airwatch-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: dandora-airwatch-db
    databaseName: airwatch
    user: airwatch
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    postgresMajorVersion: "16"
    ipAllowList: []
